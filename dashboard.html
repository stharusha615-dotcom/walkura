<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Walkura Admin</title>

<link rel="stylesheet" href="admin.css">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>

<body>

<div class="sidebar">

    <div class="logo">
        <h2>Walkura</h2>
        <span>Admin Panel</span>
    </div>

    <ul>
        <li><a href="#"><i class="fa fa-home"></i> Dashboard</a></li>
        <li><a href="#"><i class="fa fa-shoe-prints"></i> Products</a></li>
        <li><a href="#"><i class="fa fa-cart-shopping"></i> Orders</a></li>
        <li><a href="#"><i class="fa fa-users"></i> Customers</a></li>
        <li><a href="#"><i class="fa fa-chart-line"></i> Reports</a></li>
        <li><a href="#"><i class="fa fa-right-from-bracket"></i> Logout</a></li>
    </ul>

</div>

<div class="main">

    <div class="header">
        <h1>Dashboard</h1>
    </div>

    <div class="cards">

        <div class="card">
            <h3>Products</h3>
            <h1>150</h1>
        </div>

        <div class="card">
            <h3>Orders</h3>
            <h1>85</h1>
        </div>

        <div class="card">
            <h3>Customers</h3>
            <h1>45</h1>
        </div>

        <div class="card">
            <h3>Revenue</h3>
            <h1>$5400</h1>
        </div>

    </div>

    <div class="table-box">

        <h2>Recent Orders</h2>

        <table>

            <tr>
                <th>ID</th>
                <th>Customer</th>
                <th>Total</th>
                <th>Status</th>
            </tr>

            <tr>
                <td>001</td>
                <td>John</td>
                <td>$120</td>
                <td>Delivered</td>
            </tr>

            <tr>
                <td>002</td>
                <td>David</td>
                <td>$90</td>
                <td>Pending</td>
            </tr>

        </table>

    </div>

</div>

</body>
</html>
