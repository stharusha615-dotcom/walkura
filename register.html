<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walkura - Register</title>
  <link rel="stylesheet" href="register.css">
  <link rel="stylesheet" href="stars.css">
</head>
<body>
  
  <section class="register-container" style="margin-top:120px;">
    <h2>Create Your Walkura Account</h2>
    <form id="registerForm" action="php/register.php" method="POST" novalidate>
      
      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required minlength="2">
      <div class="error-message" id="nameError" style="display:none;"></div>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>
      <div class="error-message" id="emailError" style="display:none;"></div>

      <label for="password">Password:</label>
      <input type="password" id="password" name="password" placeholder="Enter a strong password" required minlength="6">
      <div class="error-message" id="passwordError" style="display:none;"></div>

      <label for="confirmPassword">Confirm Password:</label>
      <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
      <div class="error-message" id="confirmPasswordError" style="display:none;"></div>

      <button type="submit">Register</button>
      <p class="login-link">Already have an account? <a href="login.html">Login here</a></p>
    </form>
  </section>

  <footer>
      <p>© 2025 Walkura. All rights Reserved</p>
  </footer>

  <script src="stars.js"></script>
  <script>
    const regForm = document.getElementById('registerForm');
    const fullName = document.getElementById('fullname');
    const regEmail = document.getElementById('email');
    const regPassword = document.getElementById('password');
    const regConfirm = document.getElementById('confirmPassword');
    const nameError = document.getElementById('nameError');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const confirmPasswordError = document.getElementById('confirmPasswordError');

    function validateName(){
      const v = fullName.value.trim();
      if(!v){ nameError.textContent='Full name is required'; nameError.style.display='block'; fullName.classList.add('error'); return false; }
      if(v.length < 2){ nameError.textContent='Name must be at least 2 characters'; nameError.style.display='block'; fullName.classList.add('error'); return false; }
      nameError.style.display='none'; fullName.classList.remove('error'); return true;
    }
    function validateEmail(){
      const v = regEmail.value.trim();
      const pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if(!v){ emailError.textContent='Email is required'; emailError.style.display='block'; regEmail.classList.add('error'); return false; }
      if(!pattern.test(v)){ emailError.textContent='Enter a valid email'; emailError.style.display='block'; regEmail.classList.add('error'); return false; }
      emailError.style.display='none'; regEmail.classList.remove('error'); return true;
    }
    function validatePassword(){
      const v = regPassword.value.trim();
      if(!v){ passwordError.textContent='Password is required'; passwordError.style.display='block'; regPassword.classList.add('error'); return false; }
      if(v.length < 6){ passwordError.textContent='Minimum 6 characters'; passwordError.style.display='block'; regPassword.classList.add('error'); return false; }
      passwordError.style.display='none'; regPassword.classList.remove('error'); return true;
    }
    function validateConfirm(){
      const v = regConfirm.value.trim();
      if(!v){ confirmPasswordError.textContent='Please confirm password'; confirmPasswordError.style.display='block'; regConfirm.classList.add('error'); return false; }
      if(v !== regPassword.value.trim()){ confirmPasswordError.textContent='Passwords do not match'; confirmPasswordError.style.display='block'; regConfirm.classList.add('error'); return false; }
      confirmPasswordError.style.display='none'; regConfirm.classList.remove('error'); return true;
    }

    fullName.addEventListener('input', validateName);
    regEmail.addEventListener('input', validateEmail);
    regPassword.addEventListener('input', validatePassword);
    regConfirm.addEventListener('input', validateConfirm);

    // UPDATED SUBMIT LOGIC
    regForm.addEventListener('submit', function(e){
      e.preventDefault(); // Stop default submission to check validation
      const ok = [validateName(), validateEmail(), validatePassword(), validateConfirm()].every(Boolean);
      
      if(ok) {
        // If validation passes, manually submit the form to PHP
        this.submit();
      }
    });

    function updateCartCount(){
      const cart = JSON.parse(localStorage.getItem('cart')||'[]');
      const total = cart.reduce((a,i)=> a + (i.quantity||1),0);
      const el = document.getElementById('cart-count');
      if(el) el.textContent = total;
    }
    document.addEventListener('DOMContentLoaded', updateCartCount);
  </script>
</body>
</html>
